[project]
name = "awesome-ugc"
version = "0.1.0"
description = "Curated UGC ecosystem resources: platforms, creator art pipelines, and AI-assisted workflows."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "m9rco" }]
keywords = ["awesome-list", "ugc", "creator-economy", "roblox", "eggy-party", "ai-art"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
